name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
